name: index
# Adding a file to Zotero calls its Web API from the sandbox.
requiredPermissions:
  - fetch
functions:
  # Public API
  extractFrontmatter:
    path: api.ts:extractFrontmatter
    syscall:
      name: index.extractFrontmatter
      description: Extracts and optionally transforms frontmatter and top-level tags in Markdown text.
      parameters:
        - { name: text, type: string, description: Markdown text to inspect. }
        - { name: options, type: table, description: Optional frontmatter and tag removal settings., optional: true }
      returns:
        - { type: table, description: Parsed frontmatter and the optionally transformed text. }
      see: API/index
  patchFrontmatter:
    path: api.ts:patchFrontmatter
    syscall:
      name: index.patchFrontmatter
      description: Applies a table of updates to the frontmatter in Markdown text.
      parameters:
        - { name: text, type: string, description: Markdown text to update. }
        - { name: patch, type: table, description: Frontmatter keys and values to merge. }
      returns:
        - { type: string, description: Markdown text with updated frontmatter. }
      see: API/index
  text:
    path: indexer.ts:indexMarkdown
    syscall:
      name: index.markdown
      description: Indexes Markdown text in memory and returns the objects extracted from it.
      parameters:
        - { name: text, type: string, description: Markdown text to index. }
        - { name: pageMeta, type: table, description: Optional page metadata used during indexing., optional: true }
      returns:
        - { type: table, description: Objects extracted from the Markdown text. }
      see: API/index
  resolveAnchor:
    path: api.ts:resolveAnchor
    syscall:
      name: index.resolveAnchor
      description: Resolves a named anchor to its host page, tag, and source range.
      parameters:
        - { name: name, type: string, description: Anchor name without the leading dollar sign. }
        - { name: page, type: string, description: Optional page to restrict the lookup to., optional: true }
      returns:
        - { type: table, description: Resolution result including success or missing/duplicate reason. }
      see: API/index
  queryLuaObjects:
    # DEPRECATED: use index.queryLuaObjects syscall instead
    path: api.ts:queryLuaObjects
  getObjectByRef:
    # DEPRECATED: use index.getObjectByRef syscall instead
    path: api.ts:getObjectByRef

  # YAML syscalls
  yamlParse:
    path: yaml.ts:parse
    syscall:
      name: yaml.parse
      description: Parses a YAML string into a Lua value.
      parameters:
        - { name: text, type: string, description: YAML source text. }
      returns:
        - { description: Parsed YAML value. }
      see: API/yaml

  yamlStringify:
    path: yaml.ts:stringify
    syscall:
      name: yaml.stringify
      description: Serializes a Lua value as YAML text.
      parameters:
        - { name: value, description: Value to serialize. }
      returns:
        - { type: string, description: YAML representation of the value. }
      see: API/yaml

  reindexSpaceCommand:
    path: "./command.ts:reindexCommand"
    command:
      name: "Space: Reindex"
      menu: { location: space, group: "2_index", order: 1, label: "Reindex Space" }

  processIndexQueue:
    path: ./queue.ts:processIndexQueue
    mqSubscriptions:
      - queue: indexQueue
        batchSize: 8
        autoAck: false

  indexDocument:
    path: "./document.ts:indexDocument"
    events:
      - document:index
  # The Better BibTeX export is a document; when it changes, so does the
  # `zotero` index built from it.
  indexBibliography:
    path: "./zotero.ts:indexBibliography"
    events:
      - document:index

  indexPage:
    path: indexer.ts:indexPage
    events:
      - page:index

  # Denote
  newDenoteNote:
    path: ./denote.ts:newDenoteNoteCommand
    command:
      name: "Note: New"
      requireMode: rw
  denoteInsertLinksDblock:
    path: ./denote.ts:insertLinksDblockCommand
    command:
      name: "Note: Insert Links Block"
      requireMode: rw
      requireEditor: page
  denoteInsertBacklinksDblock:
    path: ./denote.ts:insertBacklinksDblockCommand
    command:
      name: "Note: Insert Backlinks Block"
      requireMode: rw
      requireEditor: page
  denoteInsertMissingLinksDblock:
    path: ./denote.ts:insertMissingLinksDblockCommand
    command:
      name: "Note: Insert Missing Links Block"
      requireMode: rw
      requireEditor: page
  denoteInsertTodaysLinksDblock:
    path: ./denote.ts:insertTodaysLinksDblockCommand
    command:
      name: "Note: Insert Today's Links Block"
      requireMode: rw
      requireEditor: page
  # What a deletion would break -- see `inboundLinksFor`.
  denoteInboundLinks:
    path: ./denote.ts:inboundLinksFor
  denoteUpdateDynamicBlocks:
    path: ./denote.ts:updateDynamicBlocksCommand
    command:
      name: "Note: Update Dynamic Blocks"
      requireMode: rw
      requireEditor: page
  denoteUpdateDblocksOnSave:
    path: ./denote.ts:updateDynamicBlocksOnSave
    events:
      - page:saved

  denoteUpdateDblocksOnOpen:
    path: ./denote.ts:updateDynamicBlocksOnOpen
    events:
      - editor:pageLoaded
  # Naming a pasted or uploaded document — see `denoteAttachmentPath`. Both
  # the upload command and the editor's paste handler call this, so an
  # identifier is issued from one place and stays unique library-wide.
  denoteAttachmentPath:
    path: ./denote.ts:denoteAttachmentPath

  denoteRenameFromFrontMatter:
    path: ./denote.ts:renameFromFrontMatterCommand
    command:
      name: "Note: Rename from Front Matter"
      requireMode: rw
      requireEditor: page
  denoteRenameOnSave:
    path: ./denote.ts:renameFromFrontMatterOnSave
    events:
      - page:saved

  # `denote` and its variants. Each is the same pipeline -- `denote.prompts`,
  # which defaults to title then keywords -- with one prompt appended, which is
  # all the Emacs commands they are named for are.
  newDenoteNoteWithSignature:
    path: ./denote.ts:newDenoteNoteWithSignatureCommand
    command:
      name: "Note: New with Signature"
      requireMode: rw
  newDenoteNoteOfType:
    path: ./denote.ts:newDenoteNoteOfTypeCommand
    command:
      name: "Note: New of Type"
      requireMode: rw
  newDenoteNoteWithDate:
    path: ./denote.ts:newDenoteNoteWithDateCommand
    command:
      name: "Note: New with Date"
      requireMode: rw
  newDenoteNoteInSubdirectory:
    path: ./denote.ts:newDenoteNoteInSubdirectoryCommand
    command:
      name: "Note: New in Subdirectory"
      requireMode: rw
  newDenoteNoteFromTemplate:
    path: ./denote.ts:newDenoteNoteFromTemplateCommand
    command:
      name: "Note: New from Template"
      requireMode: rw
  # Reads the selection, so unlike the rest it needs a page in front of it.
  newDenoteNoteFromRegion:
    path: ./denote.ts:newDenoteNoteFromRegionCommand
    command:
      name: "Note: New from Region"
      requireMode: rw
      requireEditor: page
  # `denote-link-or-create` (M-i) and `org-insert-link` (M-I) under one key:
  # on a link there is a link to edit, off one there is a link to make.
  denoteLinkOrCreate:
    path: ./denote.ts:denoteLinkOrCreateCommand
    command:
      name: "Note: Insert or Edit Link"
      key: "Alt-i"
      mac: "Alt-i"
      requireMode: rw
      requireEditor: page
  # `org-insert-link` (M-I) for somewhere outside the space. Alt-i offers the
  # library first, which is right for a note and a detour for a web page; a
  # link to what you were just reading in a browser is frequent enough to have
  # its own key. The description is prefilled with the page's own title.
  insertWebLink:
    path: ./web_link.ts:insertWebLinkCommand
    command:
      name: "Note: Insert Web Link"
      key: "Shift-Alt-i"
      mac: "Shift-Alt-i"
      requireMode: rw
      requireEditor: page
  # `denote-open-or-create`: what the page picker's create row calls.
  denoteOpenOrCreate:
    path: ./denote.ts:denoteOpenOrCreate
  # The `[[` completion's create row -- see `denoteCreateFromLink`.
  denoteCreateFromLink:
    path: ./denote.ts:denoteCreateFromLink
  # denote-journal. The `Journal:` commands in Library/Std delegate to these,
  # so there is one journal system rather than two.
  denoteJournalOpenOrCreate:
    path: ./denote.ts:denoteJournalOpenOrCreate
  denoteJournalEntries:
    path: ./denote.ts:denoteJournalEntries
  # No `command:` on these three. The `Journal:` commands in Library/Std are
  # the ones a user sees, and they call straight through to here -- giving
  # them a command each as well put two of every journal command in the
  # palette (`Journal: Next Day` and `Denote: Journal Next` doing the one
  # thing) and left the key bindings and the `journal.enabled` switch on only
  # one of the pair.
  denoteJournalToday:
    path: ./denote.ts:denoteJournalTodayCommand
  denoteJournalPrevious:
    path: ./denote.ts:denoteJournalPreviousCommand
  denoteJournalNext:
    path: ./denote.ts:denoteJournalNextCommand
  # Signatures as sequences (denote-sequence), and renaming in place
  # (denote-rename-file, denote-keywords-add/remove).
  denoteBrowseBySignature:
    path: ./denote_sequence.ts:browseBySignatureCommand
    command:
      name: "Note: Browse by Signature"
  denoteSignatureParent:
    path: ./denote_sequence.ts:signatureParentCommand
    command:
      name: "Note: Signature Parent"
  denoteSignatureChildren:
    path: ./denote_sequence.ts:signatureChildrenCommand
    command:
      name: "Note: Signature Children"
  denoteSignatureSiblings:
    path: ./denote_sequence.ts:signatureSiblingsCommand
    command:
      name: "Note: Signature Siblings"
  denoteSignatureNext:
    path: ./denote_sequence.ts:signatureNextCommand
    command:
      name: "Note: Signature Next"
  denoteSignaturePrevious:
    path: ./denote_sequence.ts:signaturePreviousCommand
    command:
      name: "Note: Signature Previous"
  # Each of these derives its answer from the note in front of you and then
  # writes: a new file, or a rename plus rewritten front matter. They have no
  # business being offered in a read-only space, or with no page open.
  denoteNewChildNote:
    path: ./denote_sequence.ts:newChildNoteCommand
    command:
      name: "Note: New Child"
      requireMode: rw
      requireEditor: page
  denoteNewSiblingNote:
    path: ./denote_sequence.ts:newSiblingNoteCommand
    command:
      name: "Note: New Sibling"
      requireMode: rw
      requireEditor: page
  denoteRenameNote:
    path: ./denote_sequence.ts:renameNoteCommand
    command:
      name: "Note: Rename"
      requireMode: rw
      requireEditor: page
  denoteSetSignature:
    path: ./denote_sequence.ts:setSignatureCommand
    command:
      name: "Note: Set Signature"
      requireMode: rw
      requireEditor: page
  # `denote-rename-file-keywords`: one command, prefilled, adding and removing.
  # Denote's `-add-keywords` / `-remove-keywords` pair is for files marked in
  # Dired, not for the file you are looking at.
  denoteKeywords:
    path: ./denote_sequence.ts:keywordsCommand
    command:
      name: "Note: Set Keywords"
      requireMode: rw
      requireEditor: page
  # Generated pages under `denote/` (signatures, keywords, calendar, health)
  # and the pickers of denote-find-link / denote-find-backlink.
  denoteGenerateView:
    path: ./denote_views.ts:generateView
    events:
      - editor:pageCreating
  denoteSignaturesPage:
    path: ./denote_views.ts:browseSignaturesPageCommand
    command:
      name: "Note: Signatures Page"
  denoteKeywordsPage:
    path: ./denote_views.ts:browseKeywordsPageCommand
    command:
      name: "Note: Keywords Page"
  denoteJournalCalendar:
    path: ./denote_views.ts:journalCalendarCommand
    command:
      name: "Journal: Calendar"
  denoteJournalOpenDate:
    path: ./denote_views.ts:journalOpenDateCommand
    command:
      name: "Journal: Open Date"
      # Open *or create*, so it writes the entry when the date has none.
      requireMode: rw
  denoteLibraryHealth:
    path: ./denote_views.ts:libraryHealthCommand
    command:
      name: "Note: Library Health"
  denoteFindLink:
    path: ./denote_views.ts:findLinkCommand
    command:
      name: "Note: Find Link"
  denoteFindBacklink:
    path: ./denote_views.ts:findBacklinkCommand
    command:
      name: "Note: Find Backlink"
  denoteRandomNote:
    path: ./denote_views.ts:randomNoteCommand
    command:
      name: "Note: Random"

  # Zotero -- see zotero.ts.
  zoteroInsertCitation:
    path: ./zotero.ts:insertCitationCommand
    command:
      name: "Zotero: Insert Citation"
      requireMode: rw
      requireEditor: page
  zoteroNewReferenceNote:
    path: ./zotero.ts:newReferenceNoteCommand
    command:
      name: "Zotero: New Reference Note"
      requireMode: rw
  zoteroOpen:
    path: ./zotero.ts:openUnderCursorCommand
    command:
      name: "Zotero: Open"
      requireEditor: page
  zoteroToggleDesktop:
    path: ./zotero.ts:toggleDesktopCommand
    command:
      name: "Zotero: Toggle Open in Desktop App"
  zoteroAddFile:
    path: ./zotero.ts:addFileCommand
    command:
      name: "Zotero: Add File"
      requireMode: rw
      requireEditor: page
  # Called by the paste and drop paths: a document into Zotero, a reference
  # note for it, and the link to write where it was dropped.
  zoteroAddDocument:
    path: ./zotero.ts:addDocument
  zoteroAdd:
    path: ./zotero.ts:addFile
  zoteroCanAddFiles:
    path: ./zotero.ts:canAddFiles
  # The library itself, from the API -- see `syncLibrary`. SilverBullet owns
  # the bibliography: it writes `zotero.bib` from what the API says, so Emacs
  # (citar, org-cite) reads a file that is current even for an item added from
  # a phone.
  zoteroSyncLibrary:
    path: ./zotero.ts:syncLibraryCommand
    command:
      name: "Zotero: Sync Library"
  zoteroResyncLibrary:
    path: ./zotero.ts:resyncLibraryCommand
    command:
      name: "Zotero: Resync Library"
  zoteroSyncLibraryWhenStale:
    path: ./zotero.ts:syncLibraryWhenStale
    events:
      - editor:pageLoaded
  # Keywords and tags, kept in step -- see `syncReferenceNote`.
  # Publishing to the Hugo site -- see plugs/index/blog.ts.
  blogPublish:
    path: ./blog.ts:publishCommand
    command:
      name: "Blog: Publish"
      requireMode: rw
  # Moving attachments nothing points at into Zotero -- see archive.ts.
  zoteroRefreshCollections:
    path: ./zotero.ts:refreshCollectionsCommand
    command:
      name: "Zotero: Refresh Collections"
  zoteroArchiveOrphans:
    path: ./archive.ts:archiveOrphansCommand
    command:
      name: "Zotero: Archive Unlinked Files"
      requireMode: rw
  # Exposed so the e2e can ask what the scan found without driving dialogs.
  orphans:
    path: ./archive.ts:orphans
  zoteroListOrphans:
    path: ./archive.ts:listOrphansCommand
    command:
      name: "Zotero: List Unlinked Files"
  blogSetToken:
    path: ./blog.ts:setTokenCommand
    command:
      name: "Blog: Set GitHub Token"
  blogCheckLinks:
    path: ./blog.ts:checkLinksCommand
    command:
      name: "Blog: Check Links"
  zoteroBackfillReferenceNotes:
    path: ./zotero.ts:backfillReferenceNotesCommand
    command:
      name: "Zotero: Backfill Reference Notes"
      requireMode: rw
  zoteroSyncReferenceNotes:
    path: ./zotero.ts:syncReferenceNotesCommand
    command:
      name: "Zotero: Sync Reference Notes"
      requireMode: rw
  zoteroSyncOnOpen:
    path: ./zotero.ts:syncReferenceNoteOnOpen
    events:
      - editor:pageLoaded
  # And once a minute for the note on screen, so a tag renamed in the Zotero
  # app shows up without navigating away and back.
  zoteroSyncOpenNote:
    path: ./zotero.ts:syncOpenReferenceNoteTick
    events:
      - cron:secondPassed
  zoteroLinkForItem:
    path: ./zotero.ts:linkForItem
  # Called by the editor plug when a citation or zotero: link is followed.
  zoteroOpenCitekey:
    path: ./zotero.ts:openCitekey
  zoteroOpenItemKey:
    path: ./zotero.ts:openItemKey

  # Headers
  headerComplete:
    path: header.ts:headerComplete
    events:
      - editor:complete

  # Anchors
  anchorComplete:
    path: complete.ts:anchorComplete
    events:
      - editor:complete

  # Hashtags
  tagComplete:
    path: tags.ts:tagComplete
    events:
      - editor:complete

  atMentionComplete:
    path: identity.ts:atMentionComplete
    events:
      - editor:complete

  resolveAtMention:
    path: identity.ts:resolveAtMention

  listIdentities:
    path: identity.ts:listIdentities

  frontmatterValueComplete:
    path: frontmatter_value_complete.ts:frontmatterValueComplete
    events:
      - editor:complete

  frontmatterComplete:
    path: frontmatter.ts:frontmatterComplete
    events:
      - editor:complete

  # Offered as commands no longer: these three think in paths, and this
  # library is addressed by identifier. `Page: Rename` prompted for a whole
  # file name, which in a Denote library is a name you are not supposed to
  # type -- `Note: Rename` asks for the title, keywords and signature the name
  # is *built* from, and `Note: Rename from Front Matter` derives it. Batch
  # Rename Prefix and Rename Linked Page are both folder-reorganising tools
  # for a space with folders.
  #
  # The functions stay, and `renamePageCommand` is still how the top bar
  # renames: `editor_ui.tsx` reaches it with
  # `invokeFunction("index.renamePageCommand")`, by function and not by
  # command name, so typing a new name over the old one in the top bar works
  # exactly as before. That is the one place a raw rename belongs.
  renamePageCommand:
    path: "./refactor.ts:renamePageCommand"
  renamePrefixCommand:
    path: "./refactor.ts:renamePrefixCommand"
  renamePageLinkCommand:
    path: "./refactor.ts:renamePageLinkCommand"

  # Refactoring Commands

  # Same again: the top bar renames a document through
  # `invokeFunction("index.renameDocumentCommand")`, and an attachment's name
  # carries a Denote identifier it should keep.
  renameDocumentCommand:
    path: "./refactor.ts:renameDocumentCommand"

  extractToPageCommand:
    path: ./refactor.ts:extractToPageCommand
    command:
      name: "Page: Extract"
      requireMode: rw
      requireEditor: page

  refreshWidgets:
    path: widget.ts:refreshWidgets

  lintYAML:
    path: lint.ts:lintYAML
    events:
      - editor:lint

  lintLua:
    path: lint.ts:lintLua
    events:
      - editor:lint

  lintObjects:
    path: lint.ts:lintObjects
    events:
      - editor:lint

  lintAnchors:
    path: lint.ts:lintAnchors
    events:
      - editor:lint

  requalifyAfterSave:
    path: requalify.ts:requalifyAfterSave
    events:
      - page:saved

  invalidateOnFileAppeared:
    path: invalidate.ts:invalidateOnFileAppeared
    events:
      - file:changed

  invalidateOnFileDeleted:
    path: invalidate.ts:invalidateOnFileDeleted
    events:
      - file:deleted

  # X-Ray editor lens
  xrayInfo:
    path: xray.ts:xrayInfo
    events:
      - editor:lint

  toggleXRayMode:
    path: xray.ts:toggleXRayMode
    command:
      name: "Editor: Toggle X-Ray"
      requireEditor: page

  # Tasks
  updateTaskState:
    path: task.ts:updateTaskState

  taskToggle:
    path: "./task.ts:taskToggle"
    events:
      - page:click
  cycleTaskStateByRef:
    path: ./task.ts:cycleTaskStateByRef
  taskToggleCommand:
    path: ./task.ts:taskCycleCommand
    command:
      name: "Task: Cycle State"
      key: Mod-. t
      requireMode: rw
      requireEditor: page

  taskComplete:
    path: ./complete.ts:completeTaskState
    events:
      - editor:complete

  removeCompletedTasksCommand:
    path: task.ts:removeCompletedTasksCommand
    command:
      name: "Task: Remove Completed"
      requireMode: rw
      requireEditor: page
