[package]
name = "silverbullet"
edition.workspace = true
license.workspace = true
publish = false

[lints]
workspace = true

[lib]
name = "silverbullet"
path = "src/lib.rs"

[[bin]]
name = "silverbullet"
path = "src/main.rs"

[dependencies]
silverbullet-server-common = { path = "../../server-common" }
silverbullet-server = { path = "../../server" }
silverbullet-server-runtime-chrome = { path = "../../server-runtime-chrome", optional = true }
getrandom = { workspace = true }
axum = { workspace = true }
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "net", "signal"] }
clap = { workspace = true }
rust-embed = { workspace = true }
mime_guess = { workspace = true }
tracing = { workspace = true }
tower = { version = "0.5", features = ["util"] }
tower-http = { workspace = true, features = ["trace"] }
tracing-subscriber = { workspace = true }
serde_json = { workspace = true }

[features]
default = ["runtime-chrome"]
# The headless-Chrome runtime behind the Runtime API. chromiumoxide is a large,
# slow dependency to compile, and a server that never runs server-side scripts
# has no use for it -- build with `--no-default-features` and the runtime is
# reported unavailable, exactly as on a host with no Chrome installed.
runtime-chrome = ["dep:silverbullet-server-runtime-chrome"]

[build-dependencies]
serde_json = { workspace = true }

[dev-dependencies]
reqwest = { workspace = true, features = ["cookies"] }
tempfile = "3"
silverbullet-server-runtime-chrome = { path = "../../server-runtime-chrome" }
